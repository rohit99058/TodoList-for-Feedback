<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body style="background-color: lightcyan;">


    <div class="row vh-100">


        <div class="col-6 border d-flex align-items-center">
            <div style="height: 300px; background-color: #C5D3E8;" class=" border w-75 p-3 mx-auto rounded-4">
                    <h2>Community Feedback</h2>


                <label for="title">Name</label>
                <input id="title" type="text" class="form-control" placeholder="Enter Your Name">

                <label class="mt-3" for="desc">Feedback</label>
                <textarea id="desc" placeholder="Write Your Feedback here!" class="form-control"></textarea>

                <button id="addBtn" class="btn btn-primary mt-4">Submit Feedback</button>

            </div>
        </div>



        <div id="todoContainer" class="col-6 overflow-scroll h-100"><h1>Latest Feedback!</h1></div>


    </div>




<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="./app.js"></script>
</body>

</html>
